name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Clean install (no data, no GPU, no Docker)
        run: python -m pip install ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: CLI starts
        run: aegis --version
  install-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure a clean core install
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install -q .
          du -sh /tmp/v/lib/python3.12/site-packages | tee size.txt
