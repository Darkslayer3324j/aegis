[project]
name = "aegis-forecast"
version = "0.1.0"
description = "Visibility-aware probabilistic conflict forecasting under delayed and selective observation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Syed Muhammad Nafay Hassan Rizvi", email = "nafayhassan3324j@gmail.com" }]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "textual>=0.80",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aegis = "aegis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
