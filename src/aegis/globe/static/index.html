<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEGIS Map</title>
<!-- MapLibre GL JS is bundled (BSD-3-Clause, see THIRD_PARTY_NOTICES.md). -->
<link rel="stylesheet" href="/static/maplibre-gl.css">
<script src="/static/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #0b0f14; --panel: rgba(13,19,28,.92); --line: #243042; --text: #c0caf5; --dim: #7b8a9c;
    --accent: #7aa2f7; --ok: #3fc1b0; --warn: #e6b450; --abstain: #ff5f56;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); overflow: hidden; }
  #map { position: fixed; inset: 0; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
  header { position: fixed; top: 12px; left: 12px; right: 12px; min-height: 48px; display: flex; align-items: center; gap: 12px;
           padding: 6px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; flex-wrap: wrap; z-index: 2; }
  .brand { font: 600 15px var(--mono); color: var(--accent); letter-spacing: .06em; white-space: nowrap; }
  .meta { font: 12px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 120px; }
  .chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .chip { font: 600 12px var(--mono); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); white-space: nowrap; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .abstain { color: var(--abstain); }
  .place { display: flex; gap: 6px; }
  input[type=search] { background: #0f1621; border: 1px solid var(--line); border-radius: 7px; color: var(--text); padding: 7px 9px; font: 13px var(--sans); }
  #place { width: 230px; }
  button.btn { background: #16202e; border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 6px 10px; font: 500 12px var(--sans); cursor: pointer; }
  button.btn.on { background: #22324a; border-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { background: none; border: 0; color: var(--dim); padding: 6px 10px; font: 500 12px var(--sans); cursor: pointer; }
  .seg button.on { background: #1b2635; color: var(--text); }
  button:focus-visible, .row:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #left { top: 76px; left: 12px; bottom: 52px; width: 300px; display: flex; flex-direction: column; z-index: 1; }
  #left .head { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  #search { width: 100%; }
  .modes { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  #list { overflow-y: auto; flex: 1; }
  .row { display: grid; grid-template-columns: 10px 1fr 46px 42px; gap: 8px; align-items: center; padding: 7px 12px; cursor: pointer;
         border-bottom: 1px solid rgba(36,48,66,.5); font-size: 13px; }
  .row small { display: block; color: var(--dim); font-size: 11px; }
  .row:hover, .row.sel { background: #152030; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .num { font: 12px var(--mono); text-align: right; }
  .num.dim { color: var(--dim); }
  .listhead { display: grid; grid-template-columns: 10px 1fr 46px 42px; gap: 8px; padding: 6px 12px; font: 11px var(--mono); color: var(--dim);
              border-bottom: 1px solid var(--line); }
  #right { top: 76px; right: 12px; bottom: 52px; width: 400px; overflow-y: auto; padding: 16px; z-index: 1; }
  #right h2 { margin: 0; font: 600 18px var(--sans); }
  #right .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .badge { display: inline-block; font: 600 11px var(--mono); padding: 2px 7px; border-radius: 5px; margin-left: 8px; vertical-align: middle; border: 1px solid currentColor; }
  .headline { margin: 14px 0 12px; font-weight: 600; line-height: 1.4; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .card .k { font: 11px var(--mono); color: var(--dim); } .card .v { font: 600 17px var(--mono); margin-top: 2px; } .card .r { font: 11px var(--mono); color: var(--dim); }
  .section { font: 600 11px var(--mono); color: var(--accent); letter-spacing: .08em; margin: 16px 0 6px; text-transform: uppercase; }
  .pt { margin: 0 0 8px; font-size: 13px; } .pt b { color: var(--accent); font-weight: 600; } .pt.vis b { color: var(--warn); }
  svg.spark { width: 100%; height: 90px; display: block; }
  .legend { display: flex; gap: 12px; font: 11px var(--mono); color: var(--dim); margin-top: 4px; flex-wrap: wrap; }
  .foot { font-size: 11px; color: var(--dim); font-style: italic; margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  footer { position: fixed; left: 12px; right: 12px; bottom: 12px; min-height: 32px; display: flex; align-items: center; gap: 10px; padding: 4px 14px;
           font-size: 11px; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; z-index: 1; }
  footer .scale { margin-left: auto; display: flex; gap: 12px; align-items: center; font-family: var(--mono); flex-wrap: wrap; }
  .empty { color: var(--dim); padding: 24px 4px; }
  #err { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); background: #2a1417; border: 1px solid var(--abstain); color: #ffb3ae;
         padding: 10px 14px; border-radius: 8px; display: none; font: 13px var(--mono); z-index: 10; max-width: 80vw; }
  #hint { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); font: 12px var(--mono); color: var(--dim);
          background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; z-index: 1; pointer-events: none; }
  .maplibregl-popup-content { background: rgba(11,15,20,.95); color: var(--text); border: 1px solid var(--line); font: 12px var(--sans); padding: 6px 9px; }
  .maplibregl-popup-tip { display: none; }
  .maplibregl-ctrl-top-right { top: 76px; right: 424px; }
  * { scrollbar-width: thin; scrollbar-color: #2f4258 transparent; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #2f4258; border-radius: 4px; }
  @media (max-width: 1100px) { #left { width: 240px; } #right { width: 330px; } .maplibregl-ctrl-top-right { right: 354px; } #place { width: 160px; } }
  @media (max-width: 860px) {
    #left { top: auto; bottom: 52px; left: 12px; right: 12px; width: auto; height: 30vh; }
    #right { top: 130px; left: 12px; right: 12px; width: auto; bottom: calc(30vh + 60px); }
    #right:has(.empty) { display: none; }
    .maplibregl-ctrl-top-right { right: 12px; top: 130px; }
    .meta { display: none; }
  }
</style>
</head>
<body>
<div id="map" aria-label="Map of recorded organised violence, forecasts and reporting visibility"></div>

<header>
  <div class="brand">◉ AEGIS</div>
  <form class="place" id="placeform" role="search">
    <input id="place" type="search" placeholder="Go to a town or place…" aria-label="Go to a place (OpenStreetMap search)">
    <button class="btn" type="submit">Go</button>
  </form>
  <button class="btn" id="btn3d" aria-pressed="false" title="Tilt the map and show terrain and 3D buildings">3D</button>
  <div class="meta" id="meta"></div>
  <div class="chips" id="chips"></div>
</header>

<aside class="panel" id="left">
  <div class="head">
    <div class="seg" id="tabs">
      <button data-tab="world">Countries</button>
      <button data-tab="provinces">Provinces</button>
    </div>
    <input id="search" type="search" placeholder="Filter…" aria-label="Filter the list">
    <div class="modes">Colour by
      <div class="seg" id="modes">
        <button data-mode="status">Status</button>
        <button data-mode="visibility">Visibility</button>
        <button data-mode="forecast">Forecast</button>
      </div>
    </div>
  </div>
  <div class="listhead"><span></span><span id="unitlabel">Country</span><span style="text-align:right">Next</span><span style="text-align:right">Vis</span></div>
  <div id="list" role="listbox" aria-label="Units"></div>
</aside>

<aside class="panel" id="right" aria-live="polite"><div class="empty">Click a country, zoom in to a province, or search for a place.</div></aside>
<div id="hint"></div>

<footer>
  <span id="footer"></span>
  <span class="scale" id="scale"></span>
</footer>
<div id="err" role="alert"></div>

<script>
const COLORS = { OK: "#3fc1b0", WARN: "#e6b450", ABSTAIN: "#ff5f56", NONE: "rgba(0,0,0,0)" };
const PROVINCE_ZOOM = 4.2;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let mode = "status", tab = "world", selected = null, is3d = false, online = true;
const data = {}, geo = {}, byGeo = { world: new Map(), provinces: new Map() }, byId = { world: new Map(), provinces: new Map() };

function showErr(msg) { $("#err").textContent = msg; $("#err").style.display = msg ? "block" : "none"; }

async function pickStyle() {
  // OpenFreeMap (OpenStreetMap data, no key) when online; AEGIS's own shapes when offline.
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 5000);
    const r = await fetch("https://tiles.openfreemap.org/styles/liberty", { signal: ctl.signal });
    if (!r.ok) throw new Error(r.statusText);
    return await r.json();
  } catch (e) {
    online = false;
    return { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": "#0b1420" } }] };
  }
}

function visColor(c) {
  const t = Math.max(0, Math.min(1, (c - 0.4) / 0.6));
  const a = [255, 95, 86], b = [230, 180, 80], d = [63, 193, 176];
  const mix = (x, y, k) => x.map((v, i) => Math.round(v + (y[i] - v) * k));
  return `rgb(${(t < 0.5 ? mix(a, b, t * 2) : mix(b, d, (t - 0.5) * 2)).join(",")})`;
}
function fcColor(v, max) {
  if (v == null) return COLORS.ABSTAIN;
  const t = Math.log1p(v) / Math.log1p(Math.max(max, 1));
  const a = [40, 60, 110], b = [122, 162, 247], d = [247, 118, 190];
  const mix = (x, y, k) => x.map((vv, i) => Math.round(vv + (y[i] - vv) * k));
  return `rgb(${(t < 0.5 ? mix(a, b, t * 2) : mix(b, d, (t - 0.5) * 2)).join(",")})`;
}
function unitColor(u, scope) {
  if (!u) return COLORS.NONE;
  const active = u.activity12 > 0 || u.obs_last > 0;
  if (!active && mode !== "forecast") return "rgba(63,193,176,0.18)";
  if (mode === "status") return COLORS[u.status];
  if (mode === "visibility") return visColor(u.C1);
  return fcColor(u.forecast[0].aegis, data[scope].maxFc);
}

function recolor() {
  for (const scope of ["world", "provinces"]) {
    const g = geo[scope]; if (!g) continue;
    const key = data[scope].polygon_key;
    for (const f of g.features) {
      const u = byGeo[scope].get(f.properties[key]);
      f.properties._c = unitColor(u, scope);
      f.properties._id = u ? u.id : -1;
    }
    const src = map.getSource(`aegis-${scope}`); if (src) src.setData(g);
  }
}

function cellsGeoJSON(cells, deg) {
  const h = deg / 2;
  return { type: "FeatureCollection", features: cells.map(c => ({ type: "Feature", properties: { n: c.n },
    geometry: { type: "Polygon", coordinates: [[[c.lng - h, c.lat - h], [c.lng + h, c.lat - h], [c.lng + h, c.lat + h], [c.lng - h, c.lat + h], [c.lng - h, c.lat - h]]] } })) };
}

const map = new maplibregl.Map({ container: "map", style: { version: 8, sources: {}, layers: [] }, center: [45, 22], zoom: 1.6,
  attributionControl: { compact: true, customAttribution: "AEGIS data: UCDP (CC BY 4.0) · Boundaries: Natural Earth · Terrain: AWS Terrain Tiles" } });
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
map.addControl(new maplibregl.ScaleControl(), "bottom-right");

async function init() {
  const style = await pickStyle();
  // Register before setStyle: an inline style can finish loading before a later listener.
  map.once("style.load", onStyle);
  map.setStyle(style);
}

async function onStyle() {
  {
    try { map.setProjection({ type: "globe" }); } catch (e) {}
    if (online) {
      map.addSource("dem", { type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 15,
        tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"] });
      map.addSource("dem-shade", { type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 15,
        tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"] });
    }
    try {
      const [w, p] = await Promise.all(["world", "provinces"].map(s => fetch(`/api/state?scope=${s}`).then(async r => {
        const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j; })));
      data.world = w; data.provinces = p;
      for (const s of ["world", "provinces"]) {
        data[s].maxFc = Math.max(1, ...data[s].units.map(u => u.forecast[0].aegis || 0));
        data[s].units.forEach(u => { byId[s].set(u.id, u); if (u.geo != null) byGeo[s].set(u.geo, u); });
      }
      const [gw, gp] = await Promise.all([fetch(w.polygons).then(r => r.json()), fetch(p.polygons).then(r => r.json())]);
      gw.features = gw.features.filter(f => f.properties.ADMIN !== "Antarctica");
      geo.world = gw; geo.provinces = gp;
    } catch (e) { showErr(`Could not load forecasts: ${e.message}`); return; }
    addLayers(); recolor(); renderHeader(); renderList(); updateHint();
  }
}

function addLayers() {
  const firstSymbol = (map.getStyle().layers.find(l => l.type === "symbol") || {}).id;
  const add = (layer) => map.addLayer(layer, firstSymbol);
  map.addSource("aegis-world", { type: "geojson", data: geo.world });
  map.addSource("aegis-provinces", { type: "geojson", data: geo.provinces });
  map.addSource("aegis-cells", { type: "geojson", data: cellsGeoJSON(data.world.cells, data.world.cell_deg) });
  if (online) add({ id: "hillshade", type: "hillshade", source: "dem-shade", minzoom: 5,
    paint: { "hillshade-exaggeration": 0.35, "hillshade-shadow-color": "#39485c" } });
  else add({ id: "aegis-land", type: "fill", source: "aegis-world", paint: { "fill-color": "#1a2635" } });
  add({ id: "aegis-world-fill", type: "fill", source: "aegis-world",
    paint: { "fill-color": ["get", "_c"], "fill-opacity": ["interpolate", ["linear"], ["zoom"], 0, 0.6, 3, 0.5, PROVINCE_ZOOM, 0] } });
  add({ id: "aegis-world-line", type: "line", source: "aegis-world",
    paint: { "line-color": "#2f4258", "line-width": 0.8, "line-opacity": ["interpolate", ["linear"], ["zoom"], 0, 0.9, 6, 0.4] } });
  add({ id: "aegis-prov-fill", type: "fill", source: "aegis-provinces", minzoom: 3,
    paint: { "fill-color": ["get", "_c"], "fill-opacity": ["interpolate", ["linear"], ["zoom"], 3, 0, PROVINCE_ZOOM, 0.5, 7, 0.32, 10, 0.12, 12.5, 0] } });
  add({ id: "aegis-prov-line", type: "line", source: "aegis-provinces", minzoom: 3,
    paint: { "line-color": "#4f6a86", "line-width": 0.7, "line-opacity": ["interpolate", ["linear"], ["zoom"], 3, 0, PROVINCE_ZOOM, 0.8, 13, 0.35] } });
  add({ id: "aegis-sel-world", type: "line", source: "aegis-world", filter: ["==", ["get", "_id"], -2],
    paint: { "line-color": "#ffffff", "line-width": 2.5 } });
  add({ id: "aegis-sel-prov", type: "line", source: "aegis-provinces", filter: ["==", ["get", "_id"], -2],
    paint: { "line-color": "#ffffff", "line-width": 2.5 } });
  const maxN = Math.max(1, ...data.world.cells.map(c => c.n));
  map.addLayer({ id: "aegis-cells", type: "fill-extrusion", source: "aegis-cells", maxzoom: 8,
    paint: { "fill-extrusion-color": ["interpolate", ["linear"], ["get", "n"], 1, "#ffcf6e", maxN, "#ff5f3a"],
             "fill-extrusion-height": ["*", ["sqrt", ["get", "n"]], 18000],
             "fill-extrusion-opacity": ["interpolate", ["linear"], ["zoom"], 0, 0.85, 6, 0.6, 8, 0] } });

  const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
  const pick = (e) => {
    const layer = map.getZoom() >= PROVINCE_ZOOM ? "aegis-prov-fill" : "aegis-world-fill";
    const f = map.queryRenderedFeatures(e.point, { layers: [layer] })[0];
    if (!f || f.properties._id < 0) return null;
    const scope = layer === "aegis-prov-fill" ? "provinces" : "world";
    return byId[scope].get(f.properties._id) ? { scope, u: byId[scope].get(f.properties._id) } : null;
  };
  map.on("mousemove", (e) => {
    const hit = pick(e);
    map.getCanvas().style.cursor = hit ? "pointer" : "";
    if (!hit) { popup.remove(); return; }
    const u = hit.u, next = u.status === "ABSTAIN" ? "not estimated" : `${u.forecast[0].lo}–${u.forecast[0].hi} next month`;
    popup.setLngLat(e.lngLat).setHTML(`<b>${esc(u.name)}</b>${hit.scope === "provinces" ? ` <span style="color:#7b8a9c">${esc(u.region)}</span>` : ""}
      <span style="color:${COLORS[u.status]}"> ${esc(u.status)}</span><br>${esc(next)} · visibility ${Math.round(u.C1 * 100)}%`).addTo(map);
  });
  map.on("mouseout", () => popup.remove());
  map.on("click", (e) => { const hit = pick(e); if (hit) select(hit.scope, hit.u.id, false); });
  map.on("zoomend", () => { updateHint(); });
}

function updateHint() {
  const z = map.getZoom();
  $("#hint").textContent = z < PROVINCE_ZOOM ? "Countries · zoom in for provinces"
    : z < 12 ? "Provinces · zoom further for towns, terrain and buildings (press 3D to tilt)"
    : "Street level: base map only · AEGIS data stays at province level";
}

function renderList() {
  const q = $("#search").value.trim().toLowerCase();
  const d = data[tab]; if (!d) return;
  let rows = d.units.filter(u => (u.activity12 > 0 || u.obs_last > 0) && (`${u.name} ${u.region}`).toLowerCase().includes(q));
  rows.sort((a, b) => (b.forecast[0].aegis ?? 1e9) - (a.forecast[0].aegis ?? 1e9));
  const total = rows.length; rows = rows.slice(0, 400);
  $("#unitlabel").textContent = tab === "world" ? "Country" : `Province (${total})`;
  $("#list").innerHTML = rows.map(u => `
    <div class="row ${selected && selected.id === u.id && selected.scope === tab ? "sel" : ""}" role="option" tabindex="0" data-id="${u.id}">
      <span class="dot" style="background:${COLORS[u.status]}"></span>
      <span>${esc(u.name)}${tab === "provinces" ? `<small>${esc(u.region)}</small>` : ""}</span>
      <span class="num">${u.status === "ABSTAIN" ? "—" : Math.round(u.forecast[0].aegis)}</span>
      <span class="num dim">${Math.round(u.C1 * 100)}%</span></div>`).join("") || `<div class="empty">No matches.</div>`;
  $("#list").querySelectorAll(".row").forEach(el => {
    el.onclick = () => select(tab, +el.dataset.id, true);
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(tab, +el.dataset.id, true); } };
  });
}

// fitBounds throws under the globe projection with pitch/padding in MapLibre 5, so the
// camera is computed directly: centre of the box, zoom from its larger side.
function flyToBox(x0, y0, x1, y1, maxZoom, extra = {}) {
  const span = Math.max(x1 - x0, (y1 - y0) * 1.4, 0.0005);
  const zoom = Math.min(maxZoom, Math.max(1, Math.log2(360 / span) - 0.6));
  map.flyTo({ center: [(x0 + x1) / 2, (y0 + y1) / 2], zoom, duration: 1600, essential: true, ...extra });
}

function bboxOf(feature) {
  let x0 = 180, x1 = -180, y0 = 90, y1 = -90;
  const walk = c => { if (typeof c[0] === "number") { x0 = Math.min(x0, c[0]); x1 = Math.max(x1, c[0]); y0 = Math.min(y0, c[1]); y1 = Math.max(y1, c[1]); } else c.forEach(walk); };
  walk(feature.geometry.coordinates);
  return [[x0, y0], [x1, y1]];
}

async function select(scope, id, doFly) {
  const u = byId[scope].get(id); if (!u) return;
  selected = { scope, id };
  map.setFilter("aegis-sel-world", ["==", ["get", "_id"], scope === "world" ? id : -2]);
  map.setFilter("aegis-sel-prov", ["==", ["get", "_id"], scope === "provinces" ? id : -2]);
  renderList();
  if (doFly && u.geo != null) {
    const key = data[scope].polygon_key;
    const f = geo[scope].features.find(ft => ft.properties[key] === u.geo);
    if (f) { const [[x0, y0], [x1, y1]] = bboxOf(f); flyToBox(x0, y0, x1, y1, scope === "world" ? 5 : 7.5); }
  }
  $("#right").innerHTML = `<div class="empty">Loading ${esc(u.name)}…</div>`;
  try {
    const r = await fetch(`/api/unit?scope=${scope}&id=${id}`);
    const d = await r.json(); if (!r.ok) throw new Error(d.error || r.statusText);
    renderDetail(d);
  } catch (e) { $("#right").innerHTML = `<div class="empty">Could not load details: ${esc(e.message)}</div>`; }
}

function spark(series) {
  if (!series.length) return "";
  const W = 360, H = 80, pad = 4;
  const max = Math.max(1, ...series.map(s => Math.max(s.obs, s.exp)));
  const x = i => pad + i * (W - 2 * pad) / Math.max(1, series.length - 1);
  const y = v => H - pad - (v / max) * (H - 2 * pad);
  const line = series.map((s, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(s.exp).toFixed(1)}`).join(" ");
  const bars = series.map((s, i) => `<rect x="${(x(i) - 4).toFixed(1)}" y="${y(s.obs).toFixed(1)}" width="8" height="${(H - pad - y(s.obs)).toFixed(1)}" fill="${s.final ? "#3a4a5e" : "#56708f"}"/>`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reported vs expected events, last 24 months">${bars}<path d="${line}" fill="none" stroke="#e6b450" stroke-width="2"/></svg>
    <div class="legend"><span>▮ reported (dark = final data)</span><span style="color:#e6b450">— expected once reporting catches up</span>
    <span style="margin-left:auto">${esc(series[0].m)} → ${esc(series[series.length - 1].m)}</span></div>`;
}

function renderDetail(u) {
  const ev = u.evidence, cls = u.status.toLowerCase();
  const cards = u.status === "ABSTAIN"
    ? `<div class="card" style="grid-column:1/-1"><div class="k">FORECAST</div><div class="v abstain">not estimated</div><div class="r">reporting from here is too impaired to support a number</div></div>`
    : u.forecast.map(f => `<div class="card"><div class="k">+${f.h} MONTH${f.h > 1 ? "S" : ""}</div><div class="v">${Math.round(f.aegis)}</div>
        <div class="r">80%: ${f.lo}–${f.hi}</div><div class="r">baseline ${Math.round(f.base)}</div></div>`).join("");
  $("#right").innerHTML = `
    <h2>${esc(u.name)}<span class="badge ${cls}">${esc(u.status)}</span></h2>
    <div class="sub">${u.scope === "provinces" ? "Province of " : ""}${esc(u.region)} · visibility ${Math.round(u.C1 * 100)}% · ${u.activity12.toFixed(1)} recorded events a month over the past year</div>
    <div class="headline">${esc(ev.headline)}</div>
    <div class="grid3">${cards}</div>
    <div class="section">Last 24 months</div>${spark(u.series)}
    <div class="section">Why</div>
    ${ev.points.map(([k, s]) => `<p class="pt ${k === "Visibility" || k === "Silent feed" ? "vis" : ""}"><b>${esc(k)}:</b> ${esc(s.charAt(0).toUpperCase() + s.slice(1))}</p>`).join("")}
    <div class="foot">${esc(ev.footer)}</div>`;
}

function verdictChip(label, bt) {
  if (!bt || !bt.ci) return `<span class="chip" title="Run aegis backtest --scope ${label === "Countries" ? "world" : "provinces"}">${label}: no backtest yet</span>`;
  const [lo, hi] = bt.ci;
  const v = hi < 0 ? ["AEGIS better", "ok"] : lo > 0 ? ["baseline better", "warn"] : ["no clear difference", ""];
  let s = `<span class="chip ${v[1]}" title="Backtest over ${bt.origins} origins: CRPS(AEGIS) − CRPS(baseline), 95% CI">${label}: ΔCRPS ${bt.diff >= 0 ? "+" : ""}${bt.diff.toFixed(2)} · ${v[0]}</span>`;
  if (bt.selected_candidate) s += `<span class="chip ok" title="Passes on development data only; not yet confirmed">dev pass: ${esc(bt.selected_candidate)} (unconfirmed)</span>`;
  return s;
}

function renderHeader() {
  const m = data.world.meta;
  const counts = { OK: 0, WARN: 0, ABSTAIN: 0 };
  data.world.units.forEach(u => counts[u.status]++);
  $("#meta").textContent = `origin ${m.origin} · data through ${m.data_through} · ${m.latest_candidate}${online ? "" : " · offline base map"}`;
  $("#chips").innerHTML = verdictChip("Countries", data.world.backtest) + verdictChip("Provinces", data.provinces.backtest)
    + `<span class="chip ok">OK ${counts.OK}</span><span class="chip warn">WARN ${counts.WARN}</span><span class="chip abstain">ABSTAIN ${counts.ABSTAIN}</span>`;
  $("#footer").textContent = data.world.footer;
  document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("#scale").innerHTML = (mode === "status" ? `<span class="ok">■ OK</span><span class="warn">■ WARN</span><span class="abstain">■ ABSTAIN</span>`
    : mode === "visibility" ? `<span style="color:#ff5f56">■ 40%</span><span style="color:#e6b450">■ 70%</span><span style="color:#3fc1b0">■ 100%+</span> reporting completeness`
    : `<span style="color:#7aa2f7">■ low</span><span style="color:#f776be">■ high</span> expected events next month`)
    + `<span style="color:#ff8c5a">▮ recorded events (aggregated ~55 km)</span>`;
}

// Changing terrain interrupts a camera animation, so when a flight is about to start the
// terrain switch waits until it has landed.
function set3d(on, { animate = true } = {}) {
  is3d = on;
  $("#btn3d").classList.toggle("on", on); $("#btn3d").setAttribute("aria-pressed", on);
  const terrain = () => { if (online) map.setTerrain(on ? { source: "dem", exaggeration: 1.4 } : null); };
  if (animate) { terrain(); map.easeTo({ pitch: on ? 62 : 0, bearing: on ? -20 : 0, duration: 900 }); }
  else map.once("moveend", terrain);
}
$("#btn3d").onclick = () => set3d(!is3d);
$("#placeform").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("#place").value.trim(); if (!q) return;
  if (!online) { showErr("Place search needs an internet connection."); return; }
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`, { headers: { "Accept-Language": "en" } });
    const hits = await r.json();
    if (!hits.length) { showErr(`No place found for "${q}".`); setTimeout(() => showErr(""), 3000); return; }
    showErr("");
    const h = hits[0], bb = h.boundingbox.map(Number);
    set3d(true, { animate: false });
    // Straight to street level at the place's centre, where 3D buildings are drawn (z >= 14).
    map.flyTo({ center: [Number(h.lon), Number(h.lat)], zoom: 15.6, pitch: 62, bearing: -20, duration: 3500, essential: true });
  } catch (err) { showErr(`Place search failed: ${err.message}`); }
};
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; renderHeader(); recolor(); });
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; renderHeader(); renderList(); });
$("#search").oninput = renderList;
init();
</script>
</body>
